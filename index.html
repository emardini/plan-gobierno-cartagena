<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan de gobierno de Cartagena de Indias</title>
  <meta name="description" content="Propuesta cívica abierta para Cartagena de Indias: escrita con datos, a la vista y con ayuda de quien quiera aportar." />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root { --theme-color: #0b5d7a; }
    .markdown-section { max-width: 860px; }
    .sidebar-nav strong { color: #0b5d7a; font-size: 0.78rem; text-transform: uppercase; letter-spacing: .04em; }
    blockquote { border-left: 4px solid var(--theme-color); background: #f1f7fa; }

    /* Barra superior fija, en escritorio y en teléfono */
    :root { --barra: 56px; }
    .barra-superior {
      position: fixed; top: 0; left: 0; right: 0; height: var(--barra); z-index: 40;
      display: flex; align-items: center; padding-left: 112px;
      background: var(--theme-color); box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }
    .barra-superior a.marca {
      color: #fff; font-weight: 600; font-size: 1rem; text-decoration: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sidebar-toggle {
      position: fixed !important; top: 0 !important; left: 0 !important; bottom: auto !important;
      width: auto !important; height: var(--barra) !important; padding: 0 14px !important;
      display: flex !important; align-items: center; gap: 8px; z-index: 50;
      background: rgba(0,0,0,.15) !important; transform: none !important;
    }
    .sidebar-toggle .sidebar-toggle-button { display: flex; flex-direction: column; justify-content: center; }
    .sidebar-toggle span { background-color: #fff !important; }
    .sidebar-toggle::after { content: 'Menú'; color: #fff; font-size: .9rem; font-weight: 600; }
    .sidebar { top: var(--barra); padding-top: 12px; }
    .sidebar > h1.app-name { display: none; }
    .content { padding-top: var(--barra); }
    .markdown-section h1, .markdown-section h2, .markdown-section h3 { scroll-margin-top: calc(var(--barra) + 12px); }
    .app-nav {
      position: fixed; top: 0; right: 0; margin: 0 16px 0 0; height: var(--barra); z-index: 45;
      display: flex; align-items: center;
    }
    .app-nav ul { margin: 0; padding: 0; }
    .app-nav li { margin: 0 0 0 18px; }
    .app-nav a { color: #fff !important; border-bottom: 0 !important; padding: 4px 0; }
    .app-nav a:hover, .app-nav a.active { text-decoration: underline; }
    @media screen and (max-width: 1100px) {
      .app-nav { display: none; }
    }
    @media screen and (max-width: 768px) {
      .barra-superior { padding-left: 104px; padding-right: 16px; }
      .content { transform: none !important; }
      .sidebar { width: 85vw; max-width: 320px; left: calc(-1 * min(85vw, 320px)); }
      body.close .sidebar { transform: translateX(min(85vw, 320px)); }
    }
  </style>
</head>
<body>
  <div id="app">Cargando…</div>
  <script>
    window.$docsify = {
      name: 'Plan de gobierno de Cartagena',
      loadSidebar: true,
      loadNavbar: true,
      relativePath: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },
      plugins: [
        function (hook) {
          // Barra superior con el nombre del plan; el botón del menú se ubica dentro de ella
          hook.mounted(function () {
            var barra = document.createElement('div');
            barra.className = 'barra-superior';
            barra.innerHTML = '<a class="marca" href="#/">Plan de gobierno de Cartagena</a>';
            // Va dentro de <main> para compartir capa con el botón del menú y la barra lateral
            (document.querySelector('main') || document.body).prepend(barra);
          });
          // En el teléfono, el menú se cierra al escoger una página
          hook.doneEach(function () {
            if (window.innerWidth <= 768) document.body.classList.remove('close');
          });
        }
      ],
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      search: {
        placeholder: 'Buscar en el plan…',
        noData: 'Sin resultados.',
        depth: 3
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
</body>
</html>
